services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grouplife}
      POSTGRES_USER: ${POSTGRES_USER:-grouplife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grouplife}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-grouplife}
      DB_USERNAME: ${POSTGRES_USER:-grouplife}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-grouplife}
      # The dev profile seeds synthetic demo data and supplies a non-secret signing key.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
