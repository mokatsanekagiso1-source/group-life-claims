services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grouplife}
      POSTGRES_USER: ${POSTGRES_USER:-grouplife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grouplife}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-grouplife}
      DB_USERNAME: ${POSTGRES_USER:-grouplife}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-grouplife}
      # The dev profile seeds synthetic demo data and supplies a non-secret signing key.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # An empty value would override Spring's own default, so compose supplies the same
      # well-known dev key. Set JWT_SECRET in infra/.env for anything beyond local use.
      JWT_SECRET: ${JWT_SECRET:-dev-only-signing-key-not-for-production-use}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    # Only the API port is published; actuator (8081) is reachable inside this network only.
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only anonymous access so the dashboard opens straight away in local demos.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claims.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
  prometheus-data:
  grafana-data:
