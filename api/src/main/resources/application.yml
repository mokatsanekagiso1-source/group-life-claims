spring:
  application:
    name: grouplife-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grouplife}
    username: ${DB_USERNAME:grouplife}
    password: ${DB_PASSWORD:grouplife}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Slightly above the 5 MB document limit, so oversize files reach the business rule and get a clear message.
      max-file-size: 6MB
      max-request-size: 7MB

app:
  jwt:
    # Required. At least 32 characters; supplied through the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:}
    issuer: grouplife-api
    ttl: PT8H
  bootstrap:
    # When set and no admin exists, an "admin" user is created with this password on startup.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  # Actuator runs on its own port so health and metrics stay off the public ingress.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
