name: Deploy to Azure

# Manual for now: run it from the Actions tab once the one-time setup in docs/deploy-azure.md is done.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Image names
        id: images
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${repo}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=${repo}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ steps.images.outputs.api }}

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.images.outputs.web }}

      # OpenID Connect: no long-lived Azure credentials are stored in GitHub.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and apps
        id: deploy
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          web_url=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters \
              apiImage='${{ steps.images.outputs.api }}' \
              webImage='${{ steps.images.outputs.web }}' \
              registryUsername='${{ github.actor }}' \
              registryPassword="$GHCR_READ_TOKEN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              jwtSecret="$JWT_SECRET" \
            --query properties.outputs.webUrl.value --output tsv)
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"
          echo "Live demo: $web_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live site
        run: |
          for i in $(seq 1 30); do
            if curl -fsS '${{ steps.deploy.outputs.web_url }}/actuator/health' | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 10
          done
          echo "The deployed site did not report healthy in time" >&2
          exit 1
