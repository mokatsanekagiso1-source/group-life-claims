name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests (Testcontainers uses the runner's Docker)
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports
            api/target/failsafe-reports

  web:
    name: Web build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    name: Compose stack and end-to-end tests
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Web serves the app and proxies the API health check
        run: |
          curl -fsS http://localhost:4200/ | grep -q '<app-root>'
          curl -fsS http://localhost:4200/actuator/health | grep -q '"status":"UP"'
      - name: Prometheus scrapes claim metrics and Grafana loads the dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -fsS 'http://localhost:9090/api/v1/query?query=grouplife_claims_status' | grep -q '"status":"PAID"'; then
              break
            fi
            sleep 3
          done
          curl -fsS 'http://localhost:9090/api/v1/query?query=grouplife_claims_status' | grep -q '"status":"PAID"'
          curl -fsS http://localhost:3000/api/health | grep -q '"database": *"ok"'
          curl -fsS http://localhost:3000/api/dashboards/uid/grouplife-claims | grep -q 'Group Life Claims'
      - name: Cypress
        working-directory: web
        run: npx cypress run
      - name: Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps --all
          for c in $(docker compose ps --all --quiet); do
            echo "== $(docker inspect --format '{{.Name}}' "$c") health"
            docker inspect --format '{{json .State.Health}}' "$c"
          done
          docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
